services:
  postgres:
    image: postgres:16
    container_name: tableturn-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tableturn
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: tableturn-redis
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: tableturn-app
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data: