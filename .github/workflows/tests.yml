name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tableturn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tableturn_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/tableturn_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/tableturn_test
      SECRET_KEY: ci-test-secret-key
      PAYSTACK_SECRET_KEY: ci-test-paystack-secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked

      - name: Create Firebase credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > firebase-service-account.json


      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest -q